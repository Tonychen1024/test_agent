<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>Dash 衝刺遊戲</title>
  <style>
    body { margin: 0; background: #1a1a2e; display: flex; justify-content: center; align-items: center; height: 100vh; }
    canvas { border: 2px solid #444; background: #16213e; display: block; }
  </style>
</head>
<body>
<canvas id="game" width="600" height="400"></canvas>
<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');

  // --- Player state ---
  const player = {
    x: 280,
    y: 180,
    w: 24,
    h: 24,
    speed: 180,         // pixels per second
    color: '#4fc3f7',   // default: light blue
    // dash
    isDashing: false,
    dashCooldown: 0,    // seconds remaining
    DASH_COOLDOWN: 2,   // seconds
    DASH_SPEED: 840,    // pixels per second during dash (frame-rate independent)
    DASH_DURATION: 0.15 // seconds
  };

  const MAX_DELTA_TIME = 0.05; // cap dt to prevent spiral-of-death on tab refocus

  // --- Enemy constants ---
  const ENEMY_SIZE = 20;
  const ENEMY_BASE_SPEED = 120;  // px/s
  const ENEMY_SPEED_INCREMENT = 20; // px/s per difficulty step
  const DIFFICULTY_INTERVAL = 5;    // seconds between speed increases

  // --- Tracker constants ---
  const TRACKER_SIZE = 20;
  const TRACKER_BASE_SPEED = 85; // px/s — slower than bounce enemies but always chases

  // --- Game state ---
  let score = 0;
  let gameOver = false;
  let difficultyTimer = 0;
  let speedBonus = 0; // cumulative speed added to enemies

  function makeEnemy(x, y, vx, vy) {
    return { x, y, w: ENEMY_SIZE, h: ENEMY_SIZE, vx, vy };
  }

  function initEnemies() {
    return [
      makeEnemy(100, 80,   ENEMY_BASE_SPEED,  ENEMY_BASE_SPEED * 0.7),
      makeEnemy(400, 300, -ENEMY_BASE_SPEED,  ENEMY_BASE_SPEED * 0.9),
      makeEnemy(500, 100,  ENEMY_BASE_SPEED * 0.8, -ENEMY_BASE_SPEED),
    ];
  }

  let enemies = initEnemies();

  function makeTracker(x, y) {
    return { x, y, w: TRACKER_SIZE, h: TRACKER_SIZE };
  }

  function initTrackers() {
    return [
      makeTracker(20,  20),
      makeTracker(560, 360),
    ];
  }

  let trackers = initTrackers();

  function resetGame() {
    player.x = 280; player.y = 180;
    player.isDashing = false;
    player.dashCooldown = 0;
    dashTimer = 0; dashVX = 0; dashVY = 0;
    dirX = 0; dirY = 0;
    score = 0;
    gameOver = false;
    difficultyTimer = 0;
    speedBonus = 0;
    enemies = initEnemies();
    trackers = initTrackers();
  }

  // --- Input state ---
  const keys = {};
  document.addEventListener('keydown', e => {
    keys[e.key] = true;
    // Restart on Game Over
    if (gameOver && (e.key === 'r' || e.key === 'R' || e.key === 'Enter')) {
      resetGame();
      return;
    }
    // Trigger dash on Shift (only once per press)
    if ((e.key === 'Shift') && !e.repeat) {
      tryDash();
    }
  });
  document.addEventListener('keyup', e => { keys[e.key] = false; });

  // current movement direction (normalised)
  let dirX = 0, dirY = 0;

  // dash internal timer
  let dashTimer = 0;
  let dashVX = 0, dashVY = 0;

  function tryDash() {
    if (player.isDashing) return;
    if (player.dashCooldown > 0) return;
    // use current direction; if standing still, dash right by default
    const dx = dirX || 1;
    const dy = dirY || 0;
    const len = Math.sqrt(dx * dx + dy * dy);
    dashVX = (dx / len) * player.DASH_SPEED;
    dashVY = (dy / len) * player.DASH_SPEED;
    player.isDashing = true;
    dashTimer = player.DASH_DURATION;
  }

  let lastTime = null;

  function update(ts) {
    if (!lastTime) lastTime = ts;
    const dt = Math.min((ts - lastTime) / 1000, MAX_DELTA_TIME);
    lastTime = ts;

    if (!gameOver) {
      // --- Score (survival time) ---
      score += dt;

      // --- Difficulty: every DIFFICULTY_INTERVAL seconds, increase enemy speed ---
      difficultyTimer += dt;
      if (difficultyTimer >= DIFFICULTY_INTERVAL) {
        difficultyTimer -= DIFFICULTY_INTERVAL;
        speedBonus += ENEMY_SPEED_INCREMENT;
        // Scale each enemy's velocity to reflect new speed
        enemies.forEach(e => {
          const spd = Math.sqrt(e.vx * e.vx + e.vy * e.vy);
          const newSpd = ENEMY_BASE_SPEED + speedBonus;
          e.vx = (e.vx / spd) * newSpd;
          e.vy = (e.vy / spd) * newSpd;
        });
      }

      // --- Normal movement direction ---
      dirX = 0;
      dirY = 0;
      if (keys['ArrowLeft']  || keys['a'] || keys['A']) dirX -= 1;
      if (keys['ArrowRight'] || keys['d'] || keys['D']) dirX += 1;
      if (keys['ArrowUp']    || keys['w'] || keys['W']) dirY -= 1;
      if (keys['ArrowDown']  || keys['s'] || keys['S']) dirY += 1;

      if (player.isDashing) {
        // Dash movement — scaled by dt for frame-rate independence
        player.x += dashVX * dt;
        player.y += dashVY * dt;
        dashTimer -= dt;
        if (dashTimer <= 0) {
          player.isDashing = false;
          player.dashCooldown = player.DASH_COOLDOWN;
        }
      } else {
        // Normal movement
        if (dirX !== 0 || dirY !== 0) {
          const len = Math.sqrt(dirX * dirX + dirY * dirY);
          player.x += (dirX / len) * player.speed * dt;
          player.y += (dirY / len) * player.speed * dt;
        }
        // Tick cooldown
        if (player.dashCooldown > 0) {
          player.dashCooldown = Math.max(0, player.dashCooldown - dt);
        }
      }

      // Clamp player to canvas
      player.x = Math.max(0, Math.min(canvas.width  - player.w, player.x));
      player.y = Math.max(0, Math.min(canvas.height - player.h, player.y));

      // Player colour
      if (player.isDashing) {
        player.color = '#ffe033'; // yellow during dash
      } else {
        player.color = '#4fc3f7'; // default light blue
      }

      // --- Update enemies ---
      enemies.forEach(e => {
        e.x += e.vx * dt;
        e.y += e.vy * dt;
        // Bounce off walls
        if (e.x < 0) { e.x = 0; e.vx = Math.abs(e.vx); }
        if (e.x + e.w > canvas.width)  { e.x = canvas.width  - e.w; e.vx = -Math.abs(e.vx); }
        if (e.y < 0) { e.y = 0; e.vy = Math.abs(e.vy); }
        if (e.y + e.h > canvas.height) { e.y = canvas.height - e.h; e.vy = -Math.abs(e.vy); }
      });

      // --- Update trackers (homing) ---
      trackers.forEach(t => {
        const cx = (player.x + player.w / 2) - (t.x + t.w / 2);
        const cy = (player.y + player.h / 2) - (t.y + t.h / 2);
        const dist = Math.sqrt(cx * cx + cy * cy);
        if (dist > 0) {
          const spd = TRACKER_BASE_SPEED + speedBonus;
          t.x += (cx / dist) * spd * dt;
          t.y += (cy / dist) * spd * dt;
        }
        // Clamp to canvas
        t.x = Math.max(0, Math.min(canvas.width  - t.w, t.x));
        t.y = Math.max(0, Math.min(canvas.height - t.h, t.y));
      });

      // --- Collision: player vs enemies (AABB) ---
      // Dash makes player invincible
      if (!player.isDashing) {
        const allEnemies = [...enemies, ...trackers];
        for (const e of allEnemies) {
          if (player.x < e.x + e.w && player.x + player.w > e.x &&
              player.y < e.y + e.h && player.y + player.h > e.y) {
            gameOver = true;
            break;
          }
        }
      }
    } // end !gameOver

    draw();
    requestAnimationFrame(update);
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw enemies
    ctx.fillStyle = '#ff4444';
    enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));

    // Draw trackers (homing, purple)
    ctx.fillStyle = '#cc44ff';
    trackers.forEach(t => ctx.fillRect(t.x, t.y, t.w, t.h));

    // Draw player
    ctx.fillStyle = player.color;
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // Draw eyes (direction indicator)
    ctx.fillStyle = '#000';
    ctx.fillRect(player.x + 5,  player.y + 6,  4, 4);
    ctx.fillRect(player.x + 15, player.y + 6,  4, 4);

    // --- Score UI ---
    ctx.font = 'bold 14px monospace';
    ctx.textBaseline = 'top';
    ctx.fillStyle = '#fff';
    ctx.fillText(`分數: ${Math.floor(score)}s`, 10, 10);
    const step = Math.floor(score / DIFFICULTY_INTERVAL);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.font = '11px monospace';
    ctx.fillText(`難度 Lv.${step + 1}`, 10, 27);

    // --- Dash cooldown UI ---
    const uiX = 10, uiY = 72;
    const barW = 140, barH = 14;

    // Background label
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(uiX - 4, uiY - 16, barW + 8, barH + 24);

    // Label text
    ctx.font = 'bold 12px monospace';
    ctx.textBaseline = 'top';

    if (player.isDashing) {
      ctx.fillStyle = '#ffe033';
      ctx.fillText('DASH! (無敵)', uiX, uiY - 14);
    } else if (player.dashCooldown > 0) {
      ctx.fillStyle = '#ff6b6b';
      ctx.fillText(`Dash 冷卻: ${player.dashCooldown.toFixed(1)}s`, uiX, uiY - 14);
    } else {
      ctx.fillStyle = '#69ff85';
      ctx.fillText('Dash: 就緒 [Shift]', uiX, uiY - 14);
    }

    // Cooldown bar
    const fill = player.dashCooldown > 0
      ? 1 - (player.dashCooldown / player.DASH_COOLDOWN)
      : 1;
    ctx.fillStyle = '#333';
    ctx.fillRect(uiX, uiY, barW, barH);
    ctx.fillStyle = fill >= 1 ? '#69ff85' : '#ffe033';
    ctx.fillRect(uiX, uiY, barW * fill, barH);
    ctx.strokeStyle = '#888';
    ctx.strokeRect(uiX, uiY, barW, barH);

    // Controls hint
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.font = '11px monospace';
    ctx.textBaseline = 'bottom';
    ctx.fillText('WASD / 方向鍵 移動   Shift 衝刺（無敵）', 10, canvas.height - 6);

    // --- Game Over overlay ---
    if (gameOver) {
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.textBaseline = 'middle';
      ctx.textAlign = 'center';

      ctx.font = 'bold 48px monospace';
      ctx.fillStyle = '#ff4444';
      ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 40);

      ctx.font = 'bold 22px monospace';
      ctx.fillStyle = '#fff';
      ctx.fillText(`存活時間：${Math.floor(score)} 秒`, canvas.width / 2, canvas.height / 2 + 10);

      ctx.font = '16px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.fillText('按 R 或 Enter 重新開始', canvas.width / 2, canvas.height / 2 + 50);

      ctx.textAlign = 'left'; // reset
    }
  }

  requestAnimationFrame(update);
</script>
</body>
</html>
